name: ListingAI CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test Backend
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7.0
        ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: cd backend && npm ci
      - name: Run tests
        run: cd backend && npm test -- --detectOpenHandles
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/listingai_test
          JWT_ACCESS_SECRET: test_access_secret_minimum_32_chars_long
          JWT_REFRESH_SECRET: test_refresh_secret_minimum_32_chars_long

  build:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest
          build-args: VITE_API_URL=${{ secrets.VITE_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy backend to Render
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}"

      - name: Deploy Frontend (Vercel)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID_SECRET: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID_SECRET: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail

          if [[ -z "${VERCEL_TOKEN:-}" ]]; then
            echo "ERROR: Missing VERCEL_TOKEN"
            exit 1
          fi

          echo "Current directory:"
          pwd

          echo "Top-level folder structure:"
          find "$GITHUB_WORKSPACE" -maxdepth 3 \
            \( -path '*/node_modules' -o -path '*/.git' -o -path '*/dist' -o -path '*/build' -o -path '*/coverage' \) -prune \
            -o -print | sed "s|$GITHUB_WORKSPACE|.|" | sort

          npm install -g vercel

          echo "Detecting frontend directory..."

          mapfile -t candidates < <(
            find "$GITHUB_WORKSPACE" \
              \( -path '*/node_modules/*' -o -path '*/.git/*' -o -path '*/dist/*' -o -path '*/build/*' -o -path '*/coverage/*' \) -prune \
              -o -type f -name 'package.json' -printf '%h\n' | sort -u
          )

          frontend_path=""
          for dir in "${candidates[@]}"; do
            if [[ -f "$dir/package.json" && -f "$dir/index.html" && -d "$dir/src" ]]; then
              frontend_path="$dir"
              break
            fi
          done

          if [[ -z "$frontend_path" ]]; then
            echo "ERROR: Could not find a frontend app directory containing package.json, index.html, and src/"
            exit 1
          fi

          frontend_rel="${frontend_path#$GITHUB_WORKSPACE/}"

          echo "Selected frontend path: $frontend_rel"
          echo "Contents of selected frontend path:"
          find "$frontend_path" -maxdepth 2 \
            \( -path '*/node_modules' -o -path '*/dist' -o -path '*/build' \) -prune \
            -o -print | sed "s|$GITHUB_WORKSPACE|.|" | sort

          vercel_project_file="$frontend_path/.vercel/project.json"
          vercel_org_id="${VERCEL_ORG_ID_SECRET:-}"
          vercel_project_id="${VERCEL_PROJECT_ID_SECRET:-}"

          if [[ -f "$vercel_project_file" ]]; then
            echo "Found Vercel project link file: ${vercel_project_file#$GITHUB_WORKSPACE/}"
            linked_org_id="$(node -pe "try { require(process.argv[1]).orgId || '' } catch (e) { '' }" "$vercel_project_file")"
            linked_project_id="$(node -pe "try { require(process.argv[1]).projectId || '' } catch (e) { '' }" "$vercel_project_file")"

            if [[ -z "$vercel_org_id" && -n "$linked_org_id" ]]; then
              vercel_org_id="$linked_org_id"
            fi

            if [[ -z "$vercel_project_id" && -n "$linked_project_id" ]]; then
              vercel_project_id="$linked_project_id"
            fi
          fi

          if [[ -z "$vercel_org_id" || -z "$vercel_project_id" ]]; then
            echo "ERROR: Missing Vercel project linkage. Provide VERCEL_ORG_ID and VERCEL_PROJECT_ID secrets or commit frontend/.vercel/project.json."
            exit 1
          fi

          echo "Using Vercel org ID: $vercel_org_id"
          echo "Using Vercel project ID: $vercel_project_id"

          export VERCEL_ORG_ID="$vercel_org_id"
          export VERCEL_PROJECT_ID="$vercel_project_id"
          deploy_cwd="$GITHUB_WORKSPACE"

          echo "Deploy command will run from repo root: ${deploy_cwd#$GITHUB_WORKSPACE/}"
          echo "Vercel project Root Directory should resolve the frontend app from there."

          vercel deploy --cwd "$deploy_cwd" --prod \
            --token="$VERCEL_TOKEN" \
            --scope="$vercel_org_id" \
            --yes
