name: ListingAI CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test Backend
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7.0
        ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: cd backend && npm ci
      - name: Run tests
        run: cd backend && npm test -- --detectOpenHandles
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/listingai_test
          JWT_ACCESS_SECRET: test_access_secret_minimum_32_chars_long
          JWT_REFRESH_SECRET: test_refresh_secret_minimum_32_chars_long

  build:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest
          build-args: VITE_API_URL=${{ secrets.VITE_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy backend to Render
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}"

      - name: Deploy Frontend (Vercel)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          set -euo pipefail

          if [[ -z "${VERCEL_TOKEN:-}" || -z "${VERCEL_ORG_ID:-}" ]]; then
            echo "ERROR: Missing VERCEL_TOKEN or VERCEL_ORG_ID"
            exit 1
          fi

          echo "Current directory:"
          pwd

          echo "Top-level folder structure:"
          find "$GITHUB_WORKSPACE" -maxdepth 3 \
            \( -path '*/node_modules' -o -path '*/.git' -o -path '*/dist' -o -path '*/build' -o -path '*/coverage' \) -prune \
            -o -print | sed "s|$GITHUB_WORKSPACE|.|" | sort

          npm install -g vercel

          echo "Detecting frontend directory..."

          mapfile -t candidates < <(
            find "$GITHUB_WORKSPACE" \
              \( -path '*/node_modules/*' -o -path '*/.git/*' -o -path '*/dist/*' -o -path '*/build/*' -o -path '*/coverage/*' \) -prune \
              -o -type f -name 'package.json' -printf '%h\n' | sort -u
          )

          frontend_path=""
          for dir in "${candidates[@]}"; do
            if [[ -f "$dir/package.json" && -f "$dir/index.html" && -d "$dir/src" ]]; then
              frontend_path="$dir"
              break
            fi
          done

          if [[ -z "$frontend_path" ]]; then
            echo "ERROR: Could not find a frontend app directory containing package.json, index.html, and src/"
            exit 1
          fi

          frontend_rel="${frontend_path#$GITHUB_WORKSPACE/}"

          echo "Selected frontend path: $frontend_rel"
          echo "Contents of selected frontend path:"
          find "$frontend_path" -maxdepth 2 \
            \( -path '*/node_modules' -o -path '*/dist' -o -path '*/build' \) -prune \
            -o -print | sed "s|$GITHUB_WORKSPACE|.|" | sort

          vercel deploy --cwd "$frontend_path" --prod \
            --token="$VERCEL_TOKEN" \
            --scope="$VERCEL_ORG_ID" \
            --yes
