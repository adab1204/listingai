version: '3.9'

services:

  # ─── MongoDB ─────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: listingai-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD required}
      MONGO_INITDB_DATABASE: listingai
    volumes:
      - mongo_data:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/init.js:ro
    ports:
      - "27017:27017"       # Remove in production
    networks:
      - listingai-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ─── Redis (rate limiting + caching) ─────
  redis:
    image: redis:7.2-alpine
    container_name: listingai-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispass} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - listingai-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ─── Backend API ──────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runner
    container_name: listingai-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV:                ${NODE_ENV:-production}
      PORT:                    5000
      MONGODB_URI:             mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD}@mongo:27017/listingai?authSource=admin
      JWT_ACCESS_SECRET:       ${JWT_ACCESS_SECRET:?required}
      JWT_REFRESH_SECRET:      ${JWT_REFRESH_SECRET:?required}
      JWT_ACCESS_EXPIRES_IN:   15m
      JWT_REFRESH_EXPIRES_IN:  7d
      ANTHROPIC_API_KEY:       ${ANTHROPIC_API_KEY:?required}
      RAZORPAY_KEY_ID:         ${RAZORPAY_KEY_ID:?required}
      RAZORPAY_KEY_SECRET:     ${RAZORPAY_KEY_SECRET:?required}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:?required}
      FRONTEND_URL:            ${FRONTEND_URL:-http://localhost:3000}
      REDIS_URL:               redis://:${REDIS_PASSWORD:-redispass}@redis:6379
    volumes:
      - backend_logs:/app/logs
    ports:
      - "5000:5000"
    networks:
      - listingai-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Frontend ─────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
    container_name: listingai-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"   # For SSL termination via nginx
    networks:
      - listingai-net

volumes:
  mongo_data:
  redis_data:
  backend_logs:

networks:
  listingai-net:
    driver: bridge
